name: Render 4K Short on Modal (Mobile Download)

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel Modal GPUs (default: 10)"
        required: false
        default: "10"
        type: string
      samples:
        description: "Cycles samples per frame (default: 12)"
        required: false
        default: "12"
        type: string
      upscale_4k:
        description: "Output True 4K 2160x3840 (true) or 1080p (false)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  render-4k-on-modal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Modal secrets are configured
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET must be added in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install Modal CLI
        run: pip install --quiet --upgrade modal

      - name: Render 4K Short on Modal Cloud GPUs
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.upscale_4k }}" = "false" ]; then
            OUT_FILE="isaac_newton_gravity_prism_short_1080p.mp4"
            modal run render_on_modal.py \
              --workers "${{ inputs.workers }}" \
              --samples "${{ inputs.samples }}" \
              --scale 100 \
              --no-upscale-4k \
              --out "$OUT_FILE"
          else
            OUT_FILE="isaac_newton_gravity_prism_short_4k.mp4"
            modal run render_on_modal.py \
              --workers "${{ inputs.workers }}" \
              --samples "${{ inputs.samples }}" \
              --scale 100 \
              --out "$OUT_FILE"
          fi
          echo "OUT_FILE=$OUT_FILE" >> "$GITHUB_ENV"
          ls -lh "$OUT_FILE"

      - name: Publish direct mobile download on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest-4k"
          NOTES="Latest render from commit $(git rev-parse --short HEAD). Tap the .mp4 file below on mobile to download directly."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --latest
            gh release upload "$TAG" "$OUT_FILE" --clobber
          else
            gh release create "$TAG" "$OUT_FILE" \
              --title "Isaac Newton 3D Short (Direct Mobile Download)" \
              --notes "$NOTES" \
              --latest
          fi
          echo "DIRECT_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/${OUT_FILE}" >> "$GITHUB_STEP_SUMMARY"
          echo "### Mobile Direct Download" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download ${OUT_FILE}](https://github.com/${{ github.repository }}/releases/download/${TAG}/${OUT_FILE})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: isaac-newton-4k-video
          path: ${{ env.OUT_FILE }}
          retention-days: 14
